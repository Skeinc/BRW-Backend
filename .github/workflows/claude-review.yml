name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Claude review
        uses: anthropics/claude-code-action@3526ba0182e074276813d3014cc27ac6720b8648 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for correctness bugs, regressions and security issues. Follow the rules in CLAUDE.md. Post the findings as a review comment, most important first, and say so if nothing is wrong.
