services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brw}
      POSTGRES_DB: ${POSTGRES_DB:-brw}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brw} -d ${POSTGRES_DB:-brw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-brwminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-brwminio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the bucket and opens public read for product and category images.
  # It has no healthcheck by design; `api` waits for it to finish via service_completed_successfully.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-brwminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-brwminio-secret}
      S3_BUCKET: ${S3_BUCKET:-brw-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}/products &&
      mc anonymous set download local/$${S3_BUCKET}/categories &&
      echo 'minio-init: bucket ready'
      "
    restart: "no"

  api:
    build: .
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-brw}:${POSTGRES_PASSWORD:-brw}@postgres:5432/${POSTGRES_DB:-brw}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-brw-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-brwminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-brwminio-secret}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/brw-media}
      S3_FORCE_PATH_STYLE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@brw.local}
      # `$$` keeps the literal `$` of a bcrypt hash; the default is a placeholder, nobody can log in with it.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2b$$10$$ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # The storefront lives in ../BRW-Frontend (stage 2). The profile keeps `docker compose up` working
  # before that repo exists; start the full stack with `docker compose --profile web up --build`.
  web:
    profiles: ["web"]
    build:
      context: ../BRW-Frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
