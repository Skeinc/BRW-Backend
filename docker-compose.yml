services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brw}
      POSTGRES_DB: ${POSTGRES_DB:-brw}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brw} -d ${POSTGRES_DB:-brw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-brw}:${POSTGRES_PASSWORD:-brw}@postgres:5432/${POSTGRES_DB:-brw}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOADS_DIR: /app/uploads
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL:-http://localhost:3000/media}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@brw.local}
      # Admin login: ADMIN_EMAIL + ADMIN_PASSWORD from .env. There is deliberately no default password.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (the admin panel password)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (a long random string, for example openssl rand -hex 32)}
      TRUST_PROXY: ${TRUST_PROXY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ORDER_NOTIFY_EMAIL: ${ORDER_NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # The storefront lives in ../BRW-Frontend.
  web:
    build:
      context: ../BRW-Frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api:3000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      PUBLIC_METRIKA_ID: ${PUBLIC_METRIKA_ID:-}
      PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  uploads_data:
