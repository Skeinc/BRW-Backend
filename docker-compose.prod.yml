# Production stack: Caddy (HTTPS) -> web (SSR) + api, Postgres, daily backups.
# Env: copy .env.example to .env.production on the server. Run with: docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# Same-origin layout: Caddy serves /media from uploads_data and proxies /api to the api.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads_data:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-brw}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brw} -d ${POSTGRES_DB:-brw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_API:-ghcr.io/skeinc/brw-backend}:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-brw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brw}
      CORS_ORIGIN: https://${DOMAIN}
      UPLOADS_DIR: /app/uploads
      PUBLIC_MEDIA_URL: https://${DOMAIN}/media
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      ORDER_NOTIFY_EMAIL: ${ORDER_NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    image: ${IMAGE_WEB:-ghcr.io/skeinc/brw-frontend}:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      PUBLIC_API_URL: https://${DOMAIN}
      API_INTERNAL_URL: http://api:3000
      PUBLIC_SITE_URL: https://${DOMAIN}
      PUBLIC_METRIKA_ID: ${PUBLIC_METRIKA_ID:-}
      PUBLIC_GA4_ID: ${PUBLIC_GA4_ID:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Daily pg_dump + uploads tarball into ./backups (a host bind mount, so it can be rsynced off the server).
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-brw}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-brw}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads_data:/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
